let cards = [];
let nextId = 451;
let activeFilter = 'all';
let editingId = null;

const DATA_VERSION = '2026-11-01-v450b';
const STORE_KEY = 'dp-board-v2';

function loadData() {
  // Skip localStorage entirely — always load fresh from embedded INITIAL_CARDS
  cards = INITIAL_CARDS.map(c => ({...c}));
  nextId = 451;
}

function saveData() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ version: DATA_VERSION, cards, nextId }));
  } catch(e) {}
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function filterCards() {
  const q = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    const title = (card.dataset.title || '').toLowerCase();
    const platform = (card.dataset.platform || '').toLowerCase();
    const notes = (card.dataset.notes || '').toLowerCase();
    const account = card.dataset.account;
    const status = card.dataset.status;
    const matchSearch = !q || title.includes(q) || platform.includes(q) || notes.includes(q);
    const matchFilter = activeFilter === 'all' ||
      (activeFilter === 'gmail' && account === 'gmail') ||
      (activeFilter === 'outlook' && account === 'outlook') ||
      (activeFilter === 'active' && status === 'active');
    card.style.display = (matchSearch && matchFilter) ? 'block' : 'none';
  });
  updateCounts();
}

function updateCounts() {
  const totalEl = document.getElementById('total-count');
  if (totalEl) totalEl.textContent = cards.length;
  const subtitleEl = document.getElementById('subtitle-count');
  if (subtitleEl) subtitleEl.textContent = cards.length;
  COLUMNS.forEach(col => {
    const colCards = document.querySelectorAll(`#col-${col.id} .card:not([style*="display: none"])`);
    const countEl = document.getElementById(`count-${col.id}`);
    if (countEl) countEl.textContent = colCards.length;
  });
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUMNS.forEach(col => {
    const colCards = cards.filter(c => c.category === col.id);
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.id = `col-${col.id}`;
    colEl.innerHTML = `
      <div class="col-header">
        <span class="col-icon">${col.icon}</span>
        <span class="col-title">${col.label}</span>
        <span class="col-count" id="count-${col.id}">${colCards.length}</span>
      </div>
      ${colCards.map(c => cardHTML(c)).join('')}
      <button class="add-card-btn" onclick="openModal(null, '${col.id}')">+ Add item</button>
    `;
    board.appendChild(colEl);
  });
  document.getElementById('total-count').textContent = cards.length;
}

function cardHTML(c) {
  const statusClass = c.status === 'active' ? '' : 'unknown';
  const urlAttr = c.url ? `href="${c.url}" target="_blank"` : '';
  return `
    <div class="card ${c.category}" 
         data-id="${c.id}" 
         data-title="${c.title}" 
         data-platform="${c.platform}" 
         data-notes="${c.notes}" 
         data-account="${c.account}" 
         data-status="${c.status}"
         onclick="openModal(${c.id})">
      <div class="card-title">${c.title}</div>
      <div class="card-meta">${c.platform}</div>
      <div class="card-tags">
        <span class="tag ${c.account}">${c.account === 'gmail' ? '📧 Gmail' : '📨 Outlook'}</span>
        <span class="tag ${c.status}">${c.status === 'active' ? '✓ Active' : c.status === 'pending' ? '⏳ Pending' : '✗ Expired'}</span>
      </div>
      ${c.notes ? `<div class="card-meta" style="font-size:0.68rem;color:#888;line-height:1.3">${c.notes.substring(0, 60)}${c.notes.length > 60 ? '…' : ''}</div>` : ''}
      <div class="card-footer">
        ${c.url ? `<a ${urlAttr} onclick="event.stopPropagation()" style="font-size:0.7rem;color:#667eea;text-decoration:none;">🔗 Open</a>` : '<span></span>'}
        <div class="card-status-dot ${statusClass}"></div>
      </div>
    </div>
  `;
}

function openModal(id, defaultCategory) {
  editingId = id;
  const modal = document.getElementById('modal-overlay');
  const deleteBtn = document.getElementById('btn-delete');
  if (id) {
    const card = cards.find(c => c.id === id);
    document.getElementById('modal-title').textContent = 'Edit Purchase';
    document.getElementById('f-name').value = card.title;
    document.getElementById('f-platform').value = card.platform;
    document.getElementById('f-category').value = card.category;
    document.getElementById('f-account').value = card.account;
    document.getElementById('f-status').value = card.status;
    document.getElementById('f-url').value = card.url || '';
    document.getElementById('f-notes').value = card.notes || '';
    deleteBtn.classList.remove('hidden');
  } else {
    document.getElementById('modal-title').textContent = 'Add Purchase';
    document.getElementById('f-name').value = '';
    document.getElementById('f-platform').value = '';
    document.getElementById('f-category').value = defaultCategory || 'courses';
    document.getElementById('f-account').value = 'gmail';
    document.getElementById('f-status').value = 'active';
    document.getElementById('f-url').value = '';
    document.getElementById('f-notes').value = '';
    deleteBtn.classList.add('hidden');
  }
  modal.classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

function saveCard() {
  const data = {
    title: document.getElementById('f-name').value.trim(),
    platform: document.getElementById('f-platform').value.trim(),
    category: document.getElementById('f-category').value,
    account: document.getElementById('f-account').value,
    status: document.getElementById('f-status').value,
    url: document.getElementById('f-url').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
  };
  if (!data.title) { alert('Please enter a name.'); return; }
  if (editingId) {
    const idx = cards.findIndex(c => c.id === editingId);
    if (idx > -1) cards[idx] = { ...cards[idx], ...data };
  } else {
    cards.push({ id: nextId++, ...data });
  }
  saveData();
  closeModal();
  renderBoard();
  filterCards();
}

function deleteCard() {
  if (!editingId) return;
  if (!confirm('Delete this item?')) return;
  cards = cards.filter(c => c.id !== editingId);
  saveData();
  closeModal();
  renderBoard();
  filterCards();
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadData();
setTimeout(function() {
  renderBoard();
  filterCards();
}, 50);
</script>
